<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="robots" content="noindex, nofollow"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>コースマップ | 皇居ランマップ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="common.css">
<style>
:root{padding-top:env(safe-area-inset-top,0px)}
/* Layout: 地図を主役に、右(スマホでは下)に区間パネル。高低差グラフは地図の直下で連動 */
.head{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px 16px;margin-bottom:14px}
.meta{color:var(--muted);font-size:.85rem;display:flex;gap:14px;flex-wrap:wrap}
.meta b{font-family:var(--font-num);font-weight:500;color:var(--fg)}
.grid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px;align-items:start}
@media (max-width:880px){.grid{grid-template-columns:minmax(0,1fr)}}
.mapbox{position:relative;padding:8px;overflow:hidden}
#map{width:100%;height:auto;display:block;touch-action:manipulation;border-radius:6px;background:var(--surface)}
.tools{position:absolute;top:16px;left:16px;right:16px;display:flex;justify-content:space-between;gap:8px;pointer-events:none}
.tools>*{pointer-events:auto}
.seg2{display:inline-flex;border:1px solid var(--line);border-radius:999px;background:var(--surface);overflow:hidden}
.seg2 button{border:0;border-radius:0;padding:6px 12px}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:.78rem;color:var(--muted);padding:6px 8px 2px}
.legend svg{vertical-align:-2px;margin-right:4px}
.locmsg{margin:4px 8px;font-size:.82rem;color:var(--muted)}
.card{margin:8px 4px 4px;padding:12px 14px;border:1px solid var(--moat);border-radius:8px;background:var(--moat-soft)}
.card h3{margin:0;font-size:1.05rem;display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.card h3 small{font-weight:400;font-size:.78rem;color:var(--muted)}
.card p{margin:6px 0 8px;font-size:.9rem}
.card .row{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;font-size:.86rem}
.card .x{margin-left:auto;padding:3px 10px;font-size:.78rem}
.elev{padding:12px 12px 6px;margin-top:16px}
.elev h2,.side h2{font-size:.78rem;letter-spacing:.08em;color:var(--muted);font-weight:500;margin:0 0 6px}
#chart{width:100%;height:auto;display:block;touch-action:pan-y;cursor:crosshair}
.readout{font-family:var(--font-num);font-size:.82rem;color:var(--muted);min-height:1.5em;margin:2px 4px 4px}
.readout b{color:var(--fg);font-weight:500}
.side{padding:14px}
.seglist{display:flex;flex-direction:column;gap:2px;margin:0 0 14px;padding:0;list-style:none}
.seg{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:8px;align-items:center;padding:7px 8px;border-radius:6px;cursor:pointer;border:1px solid transparent}
.seg:hover{background:var(--moat-soft)}
.seg[aria-selected="true"]{background:var(--moat-soft);border-color:var(--moat)}
.seg .no{font-family:var(--font-num);font-size:.8rem;color:var(--muted)}
.seg .nm{font-size:.9rem;min-width:0}
.seg .km{font-family:var(--font-num);font-size:.8rem;color:var(--muted)}
.detail{border-top:1px solid var(--line);padding-top:12px}
.detail h3{font-size:1.08rem;margin:0 0 6px;text-wrap:balance}
.detail p{margin:6px 0 10px;font-size:.92rem}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:.78rem;border:1px solid var(--line);border-radius:999px;padding:2px 9px}
.tag i{font-style:normal;color:var(--muted);margin-right:4px}
.sub{font-size:.85rem;color:var(--muted);margin:0}
.sub a{white-space:nowrap}
svg text{font-family:var(--font-body)}
.pin{cursor:pointer}
.pinlabel{paint-order:stroke;stroke:var(--surface);stroke-width:4px;stroke-linejoin:round}
</style></head><body>

<header id="sitenav" data-page="map"></header>
<div class="wrap">
  <div class="head">
    <h1>コースマップ</h1>
    <div class="meta"><span>1周 約<b>5</b>km</span><span>基準 <b>桜田門</b>・反時計回り</span><span>高低差 約<b id="relief">27</b>m</span></div>
  </div>

  <div class="grid">
    <div style="min-width:0">
      <div class="panel mapbox">
        <svg id="map" viewBox="0 0 800 620" role="img" aria-label="皇居周回コースの概略図"></svg>
        <div class="tools">
          <div class="seg2" role="group" aria-label="表示範囲">
            <button id="modeCourse" type="button" aria-pressed="true">コース</button>
            <button id="modeWide" type="button" aria-pressed="false">周辺まで</button>
          </div>
          <button id="locBtn" type="button">現在地</button>
        </div>
        <div class="legend" aria-hidden="true">
          <span><svg width="12" height="12"><circle cx="6" cy="6" r="4" fill="var(--pin)"/></svg>周回沿いの名所</span>
          <span><svg width="12" height="12"><circle cx="6" cy="6" r="4" fill="var(--surface)" stroke="var(--pin)" stroke-width="1.6"/></svg>寄り道</span>
          <span><svg width="12" height="12"><rect x="2" y="2" width="8" height="8" fill="var(--surface)" stroke="var(--pin)" stroke-width="1.6"/></svg>周辺</span>
          <span><svg width="14" height="14"><circle cx="7" cy="7" r="6" fill="var(--surface)" stroke="var(--fg)"/></svg>1kmごと</span>
          <span><svg width="14" height="10"><rect width="14" height="10" rx="2" fill="var(--water)"/></svg>お堀</span>
          <span><svg width="14" height="10"><rect width="14" height="10" rx="2" fill="var(--park)"/></svg>皇居・公園</span>
        </div>
        <p id="locmsg" class="locmsg" hidden></p>
        <div id="card" class="card" hidden aria-live="polite"></div>
      </div>
      <div class="panel elev">
        <h2>高低差(桜田門からの距離)</h2>
        <svg id="chart" viewBox="0 0 760 200" role="img" aria-label="周回コースの高低差グラフ"></svg>
        <div id="readout" class="readout">グラフをなぞると、地図上の位置が動きます</div>
      </div>
    </div>

    <aside class="panel side">
      <h2>区間</h2>
      <ul id="seglist" class="seglist" role="listbox" aria-label="区間を選ぶ"></ul>
      <div id="detail" class="detail" aria-live="polite"></div>
    </aside>
  </div>

  <p class="note" style="margin-top:18px">ベースマップ(お堀・緑地・道路)とコース形状、名所の位置は概略です。距離は1周5.0kmとして按分した概算で、資料によって5.0〜5.3kmと幅があります。標高は仮の値で、国土地理院の地図から読み取った値に差し替える予定です。</p>
</div>

<script src="data.js"></script>
<script src="basemap.js"></script>
<script src="nav.js"></script>
<script>
const {PTS,SEGS,SIGHTS,AREAS,ERAS}=window.KR, TOTAL=KR.TOTAL_KM;
const M=111320, cosL=Math.cos(35.684*Math.PI/180);
const hav=(a,b)=>{const R=6371000,r=Math.PI/180,dl=(b[0]-a[0])*r,dg=(b[1]-a[1])*r;
  const s=Math.sin(dl/2)**2+Math.cos(a[0]*r)*Math.cos(b[0]*r)*Math.sin(dg/2)**2;return 2*R*Math.asin(Math.sqrt(s));};
const cum=[0];for(let i=1;i<PTS.length;i++)cum.push(cum[i-1]+hav(PTS[i-1],PTS[i]));
const D=cum.map(v=>v/cum[cum.length-1]*TOTAL);
const SBY=Object.fromEntries(SIGHTS.map(s=>[s.id,s]));

// 距離→緯度経度・標高
function atLL(km){km=((km%TOTAL)+TOTAL)%TOTAL;let i=1;while(i<D.length-1&&D[i]<km)i++;
  const t=(km-D[i-1])/((D[i]-D[i-1])||1),a=PTS[i-1],b=PTS[i];
  return{lat:a[0]+(b[0]-a[0])*t,lng:a[1]+(b[1]-a[1])*t,h:a[2]+(b[2]-a[2])*t,seg:SEGS.findIndex(s=>km>=D[s.from]&&km<=D[s.to])};}
function nearestKm(lat,lng){let best=0,bd=1e12;for(let k=0;k<TOTAL;k+=0.005){const p=atLL(k);
  const d=((p.lat-lat)*M)**2+((p.lng-lng)*M*cosL)**2;if(d<bd){bd=d;best=k;}}return{km:best,dist:Math.sqrt(bd)};}
SIGHTS.forEach(s=>{if(s.area==="loop"&&s.km==null)s.km=nearestKm(s.lat,s.lng).km;});

// ---- 地図 ----
const NS="http://www.w3.org/2000/svg";let W=800,H=620;
const el=(t,a={},p)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e;};
const map=document.getElementById("map");
let mode="course",proj,pxPerM,selSeg=0,selPin=null,runnerKm=null;

function makeProj(pts,pad){const top=64,bottom=44;
  const xs=pts.map(p=>p[1]*cosL*M),ys=pts.map(p=>p[0]*M);
  const x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys);
  pxPerM=Math.min((W-2*pad)/(x1-x0),(H-top-bottom)/(y1-y0));
  const cx=(x0+x1)/2,cy=(y0+y1)/2,midY=top+(H-top-bottom)/2;
  proj=(lat,lng)=>[W/2+(lng*cosL*M-cx)*pxPerM,midY-(lat*M-cy)*pxPerM];
}
const ptStr=a=>a.map(p=>p[0].toFixed(1)+","+p[1].toFixed(1)).join(" ");
let segLines=[],runner;const LEFT=new Set(["gyokodori","kitanomaru"]);

function render(){
  map.textContent="";
  W=Math.max(300,Math.round(map.getBoundingClientRect().width)||800);H=Math.round(W<600?W*1.12:W*0.74);
  map.setAttribute("viewBox",`0 0 ${W} ${H}`);
  const narrow=W<600;
  const pts=mode==="course"?PTS.map(p=>[p[0],p[1]]):[...PTS.map(p=>[p[0],p[1]]),...SIGHTS.map(s=>[s.lat,s.lng])];
  makeProj(pts,narrow?22:48);
  const XY=PTS.map(p=>proj(p[0],p[1]));
  const at=k=>{const p=atLL(k);const [x,y]=proj(p.lat,p.lng);return{x,y};};
  drawBase(XY,narrow);
  segLines=SEGS.map((s,i)=>{const g=el("g",{style:"cursor:pointer"},map);
    el("polyline",{points:ptStr(XY.slice(s.from,s.to+1)),fill:"none",stroke:"transparent","stroke-width":24,"stroke-linecap":"round"},g);
    const l=el("polyline",{points:ptStr(XY.slice(s.from,s.to+1)),fill:"none",stroke:"var(--dim)","stroke-width":mode==="course"?6:5,"stroke-linecap":"round","stroke-linejoin":"round"},g);
    l.setAttribute("stroke","var(--route)");
    g.addEventListener("click",()=>selectSeg(i));return l;});
  [0.55,1.85,3.3,4.45].forEach(k=>{const a=at(k),b=at(k+0.03);const ang=Math.atan2(b.y-a.y,b.x-a.x)*180/Math.PI;
    el("path",{d:"M-5,-4.5 L4,0 L-5,4.5",fill:"none",stroke:"var(--fg)","stroke-width":1.6,"stroke-linecap":"round",transform:`translate(${a.x.toFixed(1)},${a.y.toFixed(1)}) rotate(${ang.toFixed(0)})`},map);});
  for(let k=1;k<5;k++){const p=at(k);el("circle",{cx:p.x,cy:p.y,r:9,fill:"var(--surface)",stroke:"var(--fg)","stroke-width":1.2},map);
    el("text",{x:p.x,y:p.y+3.8,"text-anchor":"middle","font-size":10,fill:"var(--fg)","font-family":"IBM Plex Mono, monospace"},map).textContent=k;}
  const s0=XY[0];el("rect",{x:s0[0]-7,y:s0[1]-7,width:14,height:14,fill:"var(--fg)"},map);
  el("text",{x:s0[0],y:s0[1]-13,"text-anchor":"middle","font-size":12,"font-weight":700,fill:"var(--fg)",class:"pinlabel"},map).textContent="START";
  // 名所ピン
  SIGHTS.forEach(s=>{const [x,y]=proj(s.lat,s.lng);if(x<0||x>W||y<0||y>H)return;
    const on=selPin===s.id;const g=el("g",{class:"pin",tabindex:0,role:"button","aria-label":s.name},map);
    el("circle",{cx:x,cy:y,r:13,fill:"transparent"},g);
    if(on)el("circle",{cx:x,cy:y,r:10,fill:"none",stroke:"var(--moat)","stroke-width":2.5},g);
    const st={stroke:"var(--pin)","stroke-width":1.6};
    if(s.area==="loop")el("circle",{cx:x,cy:y,r:4.5,fill:"var(--pin)"},g);
    else if(s.area==="detour")el("circle",{cx:x,cy:y,r:4.5,fill:"var(--surface)",...st},g);
    else el("rect",{x:x-4.5,y:y-4.5,width:9,height:9,fill:"var(--surface)",...st},g);
    if(on||mode==="wide"&&s.area!=="loop"&&!narrow){const left=x>W-150||LEFT.has(s.id);
      el("text",{x:left?x-11:x+11,y:y+4,"text-anchor":left?"end":"start","font-size":on?13:11,"font-weight":on?700:400,fill:"var(--fg)",class:"pinlabel"},g).textContent=s.name;}
    g.addEventListener("click",e=>{e.stopPropagation();selectPin(s.id);});
    g.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();selectPin(s.id);}});});
  // 方位・縮尺
  el("text",{x:W-36,y:H-62,"text-anchor":"middle","font-size":12,fill:"var(--muted)"},map).textContent="N";
  el("path",{d:`M${W-36},${H-56} L${W-36},${H-30} M${W-41},${H-49} L${W-36},${H-56} L${W-31},${H-49}`,stroke:"var(--muted)",fill:"none","stroke-width":1.4},map);
  const sb=500*pxPerM;el("line",{x1:24,y1:H-24,x2:24+sb,y2:H-24,stroke:"var(--muted)","stroke-width":2},map);
  el("line",{x1:24,y1:H-29,x2:24,y2:H-19,stroke:"var(--muted)","stroke-width":1.5},map);el("line",{x1:24+sb,y1:H-29,x2:24+sb,y2:H-19,stroke:"var(--muted)","stroke-width":1.5},map);
  el("text",{x:24,y:H-33,"font-size":11,fill:"var(--muted)"},map).textContent="500 m";
  runner=el("g",{style:"display:none"},map);
  el("circle",{r:11,fill:"var(--moat)",opacity:.25},runner);el("circle",{r:6,fill:"var(--moat)",stroke:"var(--surface)","stroke-width":2},runner);
  if(runnerKm!=null)placeRunner(runnerKm);
  paintSeg();
}
// ---- ベースマップ ----
function drawBase(XY,narrow){
  const B=window.KR_BASE;if(!B)return;
  const P=a=>ptStr(a.map(p=>proj(p[0],p[1])));
  const label=(t,ll,o)=>{const [x,y]=proj(ll[0],ll[1]);if(x<6||x>W-6||y<6||y>H-6)return;
    const e=el("text",{x,y,"text-anchor":"middle","dominant-baseline":"middle",...o},map);if(o.vertical)e.setAttribute("style","writing-mode:vertical-rl");e.textContent=t;};
  el("rect",{x:0,y:0,width:W,height:H,fill:"var(--land)"},map);
  B.greens.forEach(g=>el("polygon",{points:P(g.pts),fill:"var(--park)"},map));
  el("polygon",{points:ptStr(XY),fill:"var(--water)"},map);
  B.waters.forEach(w=>el("polygon",{points:P(w.pts),fill:"var(--water)"},map));
  el("polygon",{points:P(B.palace),fill:"var(--wood)"},map);
  el("polygon",{points:P(B.gaien),fill:"var(--lawn)"},map);
  B.bridges.forEach(b=>el("polyline",{points:P(b),stroke:"var(--land)","stroke-width":5,fill:"none"},map));
  B.roads.forEach(r=>el("polyline",{points:P(r.pts),stroke:"var(--road-case)","stroke-width":r.w*2+3,fill:"none","stroke-linecap":"round","stroke-linejoin":"round"},map));
  B.roads.forEach(r=>el("polyline",{points:P(r.pts),stroke:"var(--road)","stroke-width":r.w*2+1,fill:"none","stroke-linecap":"round","stroke-linejoin":"round"},map));
  const fs=narrow?9.5:11;
  B.districts.forEach(d=>label(d.name,d.at,{"font-size":narrow?11:13,fill:"var(--muted)","letter-spacing":"3",opacity:.8}));
  if(!narrow||mode==="course"){
    const dup=n=>mode==="wide"&&SIGHTS.some(s=>s.name.startsWith(n));
    B.greens.forEach(g=>g.name&&!dup(g.name)&&label(g.name,g.at,{"font-size":fs,fill:"var(--park-ink)"}));
    B.parks.forEach(g=>mode!=="wide"&&label(g.name,g.at,{"font-size":fs,fill:"var(--park-ink)"}));}
  if(!narrow){
    [...B.waters,...B.innerWaterLabels].filter(w=>!(mode==="wide"&&w.inner)).forEach(w=>label(w.name,w.at,{"font-size":10.5,fill:"var(--water-ink)","letter-spacing":"1",vertical:w.vertical}));
    B.roads.forEach(r=>r.name&&label(r.name,r.at,{"font-size":9.5,fill:"var(--muted)"}));}
  const c=proj(35.6850,139.7522);
  el("text",{x:c[0],y:c[1],"text-anchor":"middle","font-size":narrow?16:20,fill:"var(--park-ink)","letter-spacing":"8",opacity:.9},map).textContent="皇 居";
}
function placeRunner(km){runnerKm=km;const p=atLL(km),[x,y]=proj(p.lat,p.lng);runner.style.display="";runner.setAttribute("transform",`translate(${x.toFixed(1)},${y.toFixed(1)})`);}
map.addEventListener("click",()=>{if(selPin){selPin=null;card.hidden=true;render();}});

function setMode(m){mode=m;document.getElementById("modeCourse").setAttribute("aria-pressed",m==="course");
  document.getElementById("modeWide").setAttribute("aria-pressed",m==="wide");render();}
document.getElementById("modeCourse").onclick=()=>setMode("course");
document.getElementById("modeWide").onclick=()=>setMode("wide");

// 名所カード
const card=document.getElementById("card");
function selectPin(id){const s=SBY[id];if(!s)return;selPin=id;
  if(mode==="course"){const [x,y]=proj(s.lat,s.lng);if(x<0||x>W||y<0||y>H)mode="wide",setMode("wide");}
  render();
  const pos=s.area==="loop"?`周回 約<span class="num">${s.km.toFixed(1)}</span>km地点`:AREAS[s.area];
  card.innerHTML=`<h3>${s.name}<small>${s.kana}</small><button class="x" type="button" aria-label="閉じる">閉じる</button></h3>
   <p>${s.look}</p><div class="row"><span class="chip">${pos}</span><span class="chip">${ERAS[s.era]}</span>${s.gate?'<span class="chip">門めぐり</span>':''}
   <a href="sights.html#${s.id}">名所ページで読む</a></div>`;
  card.hidden=false;card.querySelector(".x").onclick=()=>{selPin=null;card.hidden=true;render();};}

// ---- 高低差グラフ ----
const C=document.getElementById("chart");let CW=760,CH=200;const ML=34,MR=12,MT=16,MB=28;
const xS=k=>ML+k/TOTAL*(CW-ML-MR),yS=h=>MT+(1-h/35)*(CH-MT-MB);
let bands=[],cur,cl,cdot;
function drawChart(){C.textContent="";CW=Math.max(300,Math.round(C.getBoundingClientRect().width)||760);CH=CW<600?170:200;
 C.setAttribute("viewBox",`0 0 ${CW} ${CH}`);
 for(let h=0;h<=30;h+=10){el("line",{x1:ML,x2:CW-MR,y1:yS(h),y2:yS(h),stroke:"var(--line)"},C);
  el("text",{x:ML-6,y:yS(h)+4,"text-anchor":"end","font-size":11,fill:"var(--muted)","font-family":"IBM Plex Mono, monospace"},C).textContent=h;}
 el("text",{x:ML-6,y:MT-4,"text-anchor":"end","font-size":10,fill:"var(--muted)"},C).textContent="m";
 for(let k=0;k<=5;k++)el("text",{x:xS(k),y:CH-8,"text-anchor":k===0?"start":k===5?"end":"middle","font-size":11,fill:"var(--muted)","font-family":"IBM Plex Mono, monospace"},C).textContent=k+(k===5?" km":"");
 SEGS.forEach((s,i)=>{if(i)el("line",{x1:xS(D[s.from]),x2:xS(D[s.from]),y1:MT,y2:yS(0),stroke:"var(--line)","stroke-dasharray":"2 3"},C);
  el("text",{x:(xS(D[s.from])+xS(D[s.to]))/2,y:yS(0)-5,"text-anchor":"middle","font-size":10,fill:"var(--muted)","font-family":"IBM Plex Mono, monospace"},C).textContent=i+1;});
 bands=SEGS.map(s=>{const pts=[];for(let j=s.from;j<=s.to;j++)pts.push([xS(D[j]),yS(PTS[j][2])]);
  const area=el("polygon",{points:ptStr([[pts[0][0],yS(0)],...pts,[pts[pts.length-1][0],yS(0)]]),fill:"var(--moat-soft)",opacity:0},C);
  const ln=el("polyline",{points:ptStr(pts),fill:"none",stroke:"var(--dim)","stroke-width":2.5,"stroke-linejoin":"round"},C);return{area,ln};});
 const peak=PTS.reduce((m,p,i)=>p[2]>PTS[m][2]?i:m,0);
 el("circle",{cx:xS(D[peak]),cy:yS(PTS[peak][2]),r:3.5,fill:"var(--fg)"},C);
 el("text",{x:xS(D[peak]),y:yS(PTS[peak][2])-8,"text-anchor":"middle","font-size":11,fill:"var(--fg)"},C).textContent="半蔵門";
 cur=el("g",{style:"display:none"},C);cl=el("line",{y1:MT,y2:yS(0),stroke:"var(--moat)"},cur);cdot=el("circle",{r:4.5,fill:"var(--moat)"},cur);
}
const ro=document.getElementById("readout");
function track(evt){const r=C.getBoundingClientRect();const x=(evt.clientX-r.left)/r.width*CW;
  const km=Math.max(0,Math.min(TOTAL-0.001,(x-ML)/(CW-ML-MR)*TOTAL));const p=atLL(km);
  cur.style.display="";cl.setAttribute("x1",xS(km));cl.setAttribute("x2",xS(km));cdot.setAttribute("cx",xS(km));cdot.setAttribute("cy",yS(p.h));
  placeRunner(km);
  ro.innerHTML=`<b>${km.toFixed(2)} km</b>  標高 約<b>${Math.round(p.h)} m</b>  区間${p.seg+1}`;
  if(p.seg!==selSeg)selectSeg(p.seg,true);}
C.addEventListener("pointermove",track);C.addEventListener("pointerdown",track);
document.getElementById("relief").textContent=Math.max(...PTS.map(p=>p[2]))-Math.min(...PTS.map(p=>p[2]));

// ---- 区間 ----
const list=document.getElementById("seglist"),detail=document.getElementById("detail");
SEGS.forEach((s,i)=>{const li=document.createElement("li");li.className="seg";li.tabIndex=0;li.setAttribute("role","option");
  li.innerHTML=`<span class="no">${i+1}</span><span class="nm">${s.name}</span><span class="km">${(D[s.to]-D[s.from]).toFixed(1)} km</span>`;
  li.onclick=()=>selectSeg(i);li.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();selectSeg(i);}};list.appendChild(li);});
function paintSeg(){segLines.forEach((l,j)=>{l.setAttribute("stroke",j===selSeg?"var(--moat)":"var(--route)");});}
function paintBands(){bands.forEach((b,j)=>{b.area.setAttribute("opacity",j===selSeg?1:0);b.ln.setAttribute("stroke",j===selSeg?"var(--moat)":"var(--dim)");});}
function selectSeg(i,quiet){if(i<0)return;selSeg=i;
  [...list.children].forEach((li,j)=>li.setAttribute("aria-selected",j===i));paintSeg();paintBands();
  if(0)bands.forEach((b,j)=>{b.area.setAttribute("opacity",j===i?1:0);b.ln.setAttribute("stroke",j===i?"var(--moat)":"var(--dim)");});
  const s=SEGS[i],inSeg=SIGHTS.filter(x=>x.area==="loop"&&x.km>=D[s.from]-0.05&&x.km<=D[s.to]+0.05);
  detail.innerHTML=`<h3>区間${i+1} ${s.name}</h3>
   <div class="tags"><span class="tag"><i>距離</i><span class="num">${D[s.from].toFixed(1)}〜${D[s.to].toFixed(1)}</span> km</span>
   <span class="tag"><i>坂</i>${s.slope}</span><span class="tag"><i>混雑</i>${s.crowd}</span></div>
   <p>${s.text}</p><p class="sub">景色:${s.view}</p>
   <p class="sub">名所:${inSeg.map(x=>`<a href="sights.html#${x.id}">${x.name}</a>`).join("、")||"—"}</p>`;
  try{localStorage.setItem("kokyo-seg",i)}catch(e){}}

// ---- 現在地 ----
const locBtn=document.getElementById("locBtn"),locmsg=document.getElementById("locmsg");
const gmaps='<a href="https://www.google.com/maps/@35.6852,139.7528,16z" target="_blank" rel="noopener">Googleマップで開く</a>';
locBtn.onclick=()=>{locmsg.hidden=false;
  if(!navigator.geolocation){locmsg.innerHTML="この画面では現在地を取得できません。"+gmaps+"と現在地を確認できます。";return;}
  locmsg.textContent="現在地を取得しています…";
  navigator.geolocation.getCurrentPosition(pos=>{const n=nearestKm(pos.coords.latitude,pos.coords.longitude);
    placeRunner(n.km);selectSeg(atLL(n.km).seg);
    locmsg.textContent=n.dist>400?`コースから約${(n.dist/1000).toFixed(1)}km離れています。最寄りのコース上の地点を示しています。`:"現在地に近いコース上の地点を示しています。";},
   ()=>{locmsg.innerHTML="この画面では位置情報を使えませんでした。"+gmaps+"と現在地を確認できます。";},{timeout:8000});};

// ---- 起動 ----
let saved=0;try{saved=+(localStorage.getItem("kokyo-seg")||0)}catch(e){}
selSeg=saved>=0&&saved<SEGS.length?saved:0;
drawChart();render();selectSeg(selSeg);
let lastW=0;new ResizeObserver(()=>{const w=Math.round(map.getBoundingClientRect().width);if(Math.abs(w-lastW)<4)return;lastW=w;render();drawChart();paintBands();}).observe(map);
const h=location.hash.slice(1);if(SBY[h])selectPin(h);
window.addEventListener("hashchange",()=>{const h=location.hash.slice(1);if(SBY[h])selectPin(h);});
</script>
</body></html>
